<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
{% if page.noindex %}<meta name="robots" content="noindex">
{% endif %}
{% if page.home %}{% include home-meta.html %}{% endif %}<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png">
<link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
body{margin:0}
html{scroll-behavior:smooth}
section[id]{scroll-margin-top:16px}
a{color:#2F5D50}a:hover{color:#1F4238}
@media (max-width: 480px){.site-nav{gap:14px!important;font-size:14px!important;line-height:1.6}.contact-text{text-align:left;font-size:16px!important}}
.rise{display:block;animation:rise .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.ridge .line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s .5s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ridge .spark{opacity:0;animation:spark .7s 2.2s ease-out forwards}
@keyframes spark{0%{opacity:0}40%{opacity:1}70%{opacity:.4}100%{opacity:1}}
details.faq>summary{list-style:none;display:flex;gap:12px;align-items:baseline}
details.faq>summary::-webkit-details-marker{display:none}
details.faq>summary::before{content:"＋";flex:0 0 auto;color:#2F5D50;font-weight:700}
details.faq[open]>summary::before{content:"−"}
details.faq>p{padding-left:30px}
.rv-on .rv{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--rd,0s)}
.rv-on .rv.in{opacity:1;transform:none}
#services li>a{transition:transform .25s ease,box-shadow .25s ease}
#services li>a:hover,#services li>a:focus-visible{transform:translateY(-4px);box-shadow:0 12px 28px rgba(47,93,80,.14)}
#services li>a>span:last-child{transition:transform .25s ease}
#services li>a:hover>span:last-child{transform:translateX(6px)}
#why li{position:relative}
#why li::before{content:"";position:absolute;left:0;top:-3px;width:100%;height:3px;background:#2F5D50;transform-origin:left}
.rv-on #why li::before{transform:scaleX(0);transition:transform 1s .25s cubic-bezier(.4,0,.2,1)}
.rv-on #why li.in::before{transform:scaleX(1)}
@media (prefers-reduced-motion: reduce){.rise,.ridge .line,.ridge .spark{animation:none!important;opacity:1;stroke-dashoffset:0}}
.to-top{position:fixed;right:16px;bottom:24px;width:48px;height:48px;border-radius:24px;background:#2F5D50;color:#FFFFFF;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.15);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.to-top.is-visible{opacity:1;visibility:visible}
.to-top:hover{color:#FFFFFF;background:#1F4238}
</style>
</head>
<body>
<div style="background: #FFFFFF; color: #23282A; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; line-height: 1.85">

{% include header.html %}
{{ content }}
{% include footer.html %}

</div>
{% if page.home %}{% include to-top.html %}{% endif %}{% include motion.html %}</body>
</html>
